name: CI

# Every push to main, and every pull request into it: build the packages the way a release builds them, without
# publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # xcode-27 (a preview image): macos-latest still defaults to Xcode 26, while the .NET 11 workloads ship the
    # 27.x iOS packs and the native Firebase shims (firebase_ios/native) are built against the Xcode 27 SDKs.
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          workloads: maui-ios, maui-android

    - name: Select Xcode 27.2
      run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer && xcodebuild -version

    - name: Resolve SPM Dependencies
      run: |
        xcodebuild -project firebase_ios/native/shinyfirebase/ShinyFirebase.xcodeproj -scheme ShinyFirebase -resolvePackageDependencies
        xcodebuild -project firebase_ios/native/firestore/ShinyFirebaseFirestore.xcodeproj -scheme ShinyFirebaseFirestore -resolvePackageDependencies

    # Release packs on build (GeneratePackageOnBuild) - packages come out as 0.0.0-dev here
    - name: Build
      run: dotnet build Firebase.slnx /restore -m -property:Configuration=Release

    - name: Test
      run: dotnet test tests/Shiny.DocumentDb.Firestore.Mobile.Tests --configuration Release --no-build

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: src/**/bin/Release/*.*nupkg
        retention-days: 5
